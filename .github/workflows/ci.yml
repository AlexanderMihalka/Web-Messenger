name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: messenger
          POSTGRES_PASSWORD: messenger
          POSTGRES_DB: messenger_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U messenger -d messenger_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: server/requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - name: Ruff
        run: ruff check app migrations

      - name: Mypy
        run: mypy app

      - name: Перевірка, що міграції застосовуються начисто
        env:
          DATABASE_URL: postgresql+psycopg://messenger:messenger@localhost:5432/messenger_test
        run: alembic upgrade head

      - name: Pytest
        env:
          TEST_DATABASE_URL: postgresql+psycopg://messenger:messenger@localhost:5432/messenger_test
        run: pytest --cov=app --cov-report=term-missing

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - run: npm ci
      - name: ESLint
        run: npx eslint .
      - name: Типи
        run: npx tsc -b --noEmit
      - name: Білд
        run: npm run build
